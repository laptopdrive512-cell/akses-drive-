<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Proteksi Akses Perangkat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 90%;
            box-sizing: border-box;
        }
        .error-box { display: none; }
        h2 { color: #1a73e8; font-size: 20px; margin-top: 15px; margin-bottom: 8px; }
        .error-box h2 { color: #d93025; }
        p { color: #5f6368; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        
        /* Optimasi tombol khusus HP agar responsif saat disentuh */
        .btn-drive {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(26,115,232,0.3);
            display: block;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-drive:active {
            background: #1557b0;
        }
    </style>
</head>
<body>

<!-- Tampilan untuk Pengguna Handphone -->
<div class="box" id="hpBox">
    <div style="font-size: 50px;">📲</div>
    <h2>Membuka Google Drive...</h2>
    <p>Jika aplikasi Google Drive tidak terbuka secara otomatis, silakan klik tombol di bawah ini untuk masuk.</p>
    
    <!-- Perbaikan: Menggunakan tag Anchor dengan ontouchstart agar instan merespon di HP -->
    <a href="#" id="linkDrive" class="btn-drive" ontouchstart="bukaDriveManual(event)" onclick="bukaDriveManual(event)">Buka Aplikasi Drive</a>
</div>

<!-- Tampilan Blokir untuk Laptop -->
<div class="box error-box" id="laptopBlocker">
    <div style="font-size: 50px;">🚫</div>
    <h2>Akses Ditolak!</h2>
    <p>Demi keamanan data, perangkat Komputer atau Laptop <b>dilarang keras</b> mengakses folder ini. Silakan gunakan Handphone Anda.</p>
</div>

<script>
    const folderId = "1mzLtwhunAhuerKIHWq7vrbvJnTVBg3sF";
    const ua = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const webFallback = `https://google.com{folderId}`;

    function dlink() {
        if (isAndroid) {
            return `intent://://google.com{folderId}#Intent;scheme=https;package=com.google.android.apps.docs;S.browser_fallback_url=${encodeURIComponent(webFallback)};end;`;
        } else if (isIOS) {
            return `googledrive://drive/folders/${folderId}`;
        }
        return webFallback;
    }

    // Fungsi eksekusi tombol manual saat disentuh jari
    function bukaDriveManual(e) {
        if(e) e.preventDefault();
        
        window.location.href = dlink();
        
        if (isIOS) {
            setTimeout(function() { window.location.href = webFallback; }, 1500);
        }
    }

    // Eksekusi otomatis saat halaman dimuat
    (function inisialisasi() {
        if (isAndroid || isIOS) {
            document.getElementById("hpBox").style.display = "block";
            
            // Set link href cadangan pada tombol
            document.getElementById("linkDrive").href = dlink();
            
            // Coba arahkan otomatis di awal
            window.location.href = dlink();
            if (isIOS) {
                setTimeout(function() { window.location.href = webFallback; }, 1500);
            }
        } else {
            document.getElementById("hpBox").style.display = "none";
            document.getElementById("laptopBlocker").style.display = "block";
        }
    })();
</script>
</body>
</html>
