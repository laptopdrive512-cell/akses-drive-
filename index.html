<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Dokumen...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .error-box {
            display: none;
            background: white;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 400px;
            margin: 50px auto;
            border-top: 5px solid #d9534f;
        }
        h1 { color: #d9534f; font-size: 22px; margin-top: 0; }
        p { color: #666; line-height: 1.5; font-size: 15px; }
        .icon { font-size: 48px; margin-bottom: 15px; }
        .loading { font-size: 16px; color: #4285F4; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Tampilan jika dibuka di Laptop / PC -->
    <div id="desktop-message" class="error-box">
        <div class="icon">🚫</div>
        <h1>Akses Ditolak!</h1>
        <p>Demi keamanan data, folder ini <strong>hanya dapat diakses melalui aplikasi resmi Google Drive di HP</strong> (Smartphone).</p>
        <p>Silakan pindai QR Code atau buka link ini langsung dari HP Anda.</p>
    </div>

    <!-- Tampilan loading sementara khusus pengguna HP -->
    <div id="loading-message">
        <div class="loading">Membuka Aplikasi Google Drive...</div>
    </div>

    <script>
        // ID Folder Google Drive Anda
        const FOLDER_ID = "1mzLtwhunAhuerKIHWq7vrbvJnTVBg3sF";

        // Deteksi agen perangkat (User Agent)
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        
        // Cek apakah perangkat adalah HP (Android / iOS / Windows Phone)
        const isMobile = /android|iphone|ipad|ipod|windows phone/i.test(userAgent);

        if (isMobile) {
            // Jalur Deep Link untuk memaksa membuka aplikasi Google Drive secara langsung
            const driveAppUrl = "googledrive://drive/folders/" + FOLDER_ID; // Protokol iOS
            const intentUrl = "intent://://google.com" + FOLDER_ID + "#Intent;scheme=https;package=com.google.android.apps.docs;end"; // Protokol Android

            if (/android/i.test(userAgent)) {
                // Paksa HP Android langsung membuka aplikasi Drive
                window.location.href = intentUrl;
            } else if (/iphone|ipad|ipod/i.test(userAgent)) {
                // Paksa iPhone/iPad langsung membuka aplikasi Drive
                window.location.href = driveAppUrl;
                
                // Antisipasi cadangan jika aplikasi Google Drive belum terinstal di iPhone
                setTimeout(function() {
                    window.location.href = "https://://google.com" + FOLDER_ID;
                }, 1500);
            } else {
                // Browser HP lainnya
                window.location.href = "https://://google.com" + FOLDER_ID;
            }
        } else {
            // Jika diakses menggunakan Laptop/PC, sembunyikan loading dan tampilkan blokir
            document.getElementById("loading-message").style.display = "none";
            document.getElementById("desktop-message").style.display = "block";
        }
    </script>
</body>
</html>
