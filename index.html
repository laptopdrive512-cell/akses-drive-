<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Proteksi Akses Perangkat</title>
    <style>
        /* Desain minimalis untuk memblokir tampilan Laptop */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 90%;
            display: none; /* Sembunyikan secara bawaan, hanya muncul di laptop */
        }
        h2 { color: #d93025; font-size: 22px; margin-top: 15px; }
        p { color: #5f6368; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="error-box" id="laptopBlocker">
    <div style="font-size: 60px;">🚫</div>
    <h2>Akses Ditolak!</h2>
    <p>Demi keamanan data, perangkat Komputer atau Laptop <b>dilarang keras</b> mengakses folder ini. Silakan gunakan Handphone Anda.</p>
</div>

<script>
    // ID Folder Google Drive Anda
    const folderId = "1mzLtwhunAhuerKIHWq7vrbvJnTVBg3sF";

    // Deteksi tipe sistem operasi perangkat
    const ua = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);

    // Jalankan sistem proteksi saat halaman dimuat
    (function proteksiDanArahkan() {
        const webFallback = `https://google.com{folderId}`;

        if (isAndroid) {
            // HP Android: Paksa panggil aplikasi Google Drive via Deep Link Intent
            const androidIntent = `intent://://google.com{folderId}#Intent;scheme=https;package=com.google.android.apps.docs;S.browser_fallback_url=${encodeURIComponent(webFallback)};end;`;
            window.location.replace(androidIntent);
        } else if (isIOS) {
            // HP iPhone/iPad: Panggil skema aplikasi Google Drive iOS
            window.location.replace(`googledrive://drive/folders/${folderId}`);
            
            // Cadangan jika aplikasi Drive tidak terinstal di iPhone, lempar ke Safari
            setTimeout(function() {
                window.location.replace(webFallback);
            }, 1000);
        } else {
            // Jika Perangkat berupa Laptop, Komputer, atau Mac: Kunci halaman!
            document.getElementById("laptopBlocker").style.display = "block";
        }
    })();
</script>
</body>
</html>
